org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableR8.fullMode=true
# AGP 9 built-in Kotlin for migrated plugins.
android.builtInKotlin=true
# Keep legacy AGP DSL until Flutter finishes the new-DSL migration.
android.newDsl=false
# AGP 9.x reports embedded Kotlin 2.2.10; Flutter requires >=2.2.20.
skipDependencyChecks=true
# receive_sharing_intent 1.9 needs API 37; AGP 9.1 max-recommended is 36.
android.suppressUnsupportedCompileSdk=37
