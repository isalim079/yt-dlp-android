<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BotGuard</title>
</head>
<body>
<script>
(function () {
  function base64ToU8(b64) {
    var bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function u8ToWebsafe(u8) {
    var s = '';
    for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
  }

  var state = {
    vmFunctions: {},
    webPoSignalOutput: [],
    mintCallback: null
  };

  window.botguardInjectInterpreter = function (code) {
    return new Promise(function (resolve, reject) {
      try {
        var s = document.createElement('script');
        s.text = code;
        document.documentElement.appendChild(s);
        resolve('ok');
      } catch (e) {
        reject(e);
      }
    });
  };

  window.botguardLoad = function (program, globalName) {
    return new Promise(function (resolve, reject) {
      try {
        var vm = window[globalName];
        if (!vm) return reject(new Error('VM not found: ' + globalName));
        if (!vm.a) return reject(new Error('Could not load program'));
        state.vmFunctions = {};
        state.webPoSignalOutput = [];
        state.mintCallback = null;
        var cb = function (asyncSnapshot, shutdown, passEvent, checkCamera) {
          state.vmFunctions.asyncSnapshotFunction = asyncSnapshot;
          state.vmFunctions.shutdownFunction = shutdown;
          state.vmFunctions.passEventFunction = passEvent;
          state.vmFunctions.checkCameraFunction = checkCamera;
        };
        var loaded = vm.a(program, cb, true, undefined, function () {}, [[], []]);
        Promise.resolve(loaded && loaded[0]).then(function () {
          resolve('ok');
        }).catch(reject);
      } catch (e) {
        reject(e);
      }
    });
  };

  window.botguardSnapshot = function () {
    return new Promise(function (resolve, reject) {
      var fn = state.vmFunctions.asyncSnapshotFunction;
      if (!fn) return reject(new Error('Async snapshot function not found'));
      state.webPoSignalOutput = [];
      fn(function (response) { resolve(response); }, [
        undefined,
        undefined,
        state.webPoSignalOutput,
        undefined
      ]);
    });
  };

  window.botguardSetIntegrityToken = function (integrityTokenB64) {
    return new Promise(function (resolve, reject) {
      var getMinter = state.webPoSignalOutput[0];
      if (!getMinter) return reject(new Error('PMD:Undefined'));
      Promise.resolve(getMinter(base64ToU8(integrityTokenB64))).then(function (mint) {
        if (typeof mint !== 'function') return reject(new Error('APF:Failed'));
        state.mintCallback = mint;
        resolve('ok');
      }).catch(reject);
    });
  };

  window.botguardMint = function (identifier) {
    return new Promise(function (resolve, reject) {
      if (!state.mintCallback) return reject(new Error('Minter not ready'));
      Promise.resolve(state.mintCallback(new TextEncoder().encode(identifier))).then(function (result) {
        if (!result) return reject(new Error('YNJ:Undefined'));
        if (!(result instanceof Uint8Array)) {
          if (ArrayBuffer.isView(result)) result = new Uint8Array(result.buffer);
          else return reject(new Error('ODM:Invalid'));
        }
        resolve(u8ToWebsafe(result));
      }).catch(reject);
    });
  };
})();
</script>
</body>
</html>
