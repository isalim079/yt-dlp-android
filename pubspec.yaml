name: yxz_tube
description: YXZ Tube — a youtube video player.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  process_run: ^0.13.0
  path_provider: ^2.1.2
  shared_preferences: ^2.5.5
  file_picker: ^13.1.0
  provider: ^6.1.2
  logger: ^2.3.0
  permission_handler: ^11.3.1
  flutter_riverpod: ^2.5.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.0
  url_launcher: ^6.2.6
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.3.1
  receive_sharing_intent: ^1.9.0
  flutter_native_splash: ^2.4.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Plugins that still ship older Android impls which apply KGP.
# win32 6 is required by windows_file_picker 2.x (file_picker 13).
dependency_overrides:
  wakelock_plus: ^1.8.0
  shared_preferences_android: ^2.4.28
  win32: ^6.3.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: false
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48
  macos:
    generate: false

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#ffffff"
  image: assets/icons/splash.png
  android_12:
    color: "#ffffff"
    color_dark: "#ffffff"
    image: assets/icons/splash.png
    icon_background_color: "#ffffff"
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    # - assets/bin/yt-dlp
    # - assets/bin/yt-dlp.exe
    # - assets/bin/yt-dlp_macos
    - assets/icons/
